name: CI

on:
  push:
    branches: [main]
    # A release is a pushed tag: `git tag v0.3.10 && git push origin v0.3.10`, or
    # a GitHub release published against one. Nothing is published from main:
    # `latest` names the newest RELEASE, because that is the tag `compose.yaml`
    # pulls and people run at home. Publishing it from every merge meant a
    # `docker compose pull` picked up whatever landed an hour ago. The tag must
    # match the version in package.json — see the image job, which refuses the
    # build otherwise.
    tags: ['v*']
  pull_request:
  # A release published against an existing tag builds too, so a version whose
  # tag push failed can be cut again without moving the tag.
  release:
    types: [published]

# One run per branch, pull request or version. A release published moments
# after its tag was pushed fires twice; both runs would build the same commit
# and race each other to push the same tags.
concurrency:
  group: ci-${{ github.event.release.tag_name || github.ref_name }}
  # Superseding a pull request's run is free. Superseding a publish is not:
  # a cancelled run can leave one registry updated and the other not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # A hung job otherwise occupies a runner for six hours before GitHub gives
    # up on it. Nothing here takes five minutes when it is working.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

  # The Playwright journey is the only coverage the auth, import, splits and
  # API-token paths have end to end. It existed but nothing ran it, so those
  # paths were effectively untested in CI.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The browsers AND the system libraries they need are already in this image,
    # so no step here runs apt.
    #
    # `npx playwright install --with-deps` did, and apt on a GitHub runner
    # resolves through an Azure mirror that is regularly unreachable: the log
    # shows four rounds of `Ign:` against azure.archive.ubuntu.com before it
    # falls back to archive.ubuntu.com. That is the step runs were stalling in,
    # and it had nothing to do with Playwright.
    #
    # Pinned to the @playwright/test version in package.json. They move together
    # — an image older than the library has the wrong browser build — so bump
    # both in the same commit.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium's renderer processes share memory through /dev/shm, which is
      # 64 MB in a container by default. Recommended by Playwright's own Docker
      # guidance; without it tabs crash under load rather than failing a test.
      options: --ipc=host
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The image tag and the installed library have to be the same version, and
      # nothing else makes them so: `^1.62.1` moves on its own, and a mismatch
      # surfaces as a browser that will not launch rather than as a version
      # complaint. Checked here so the failure names the real problem.
      - name: playwright image matches the installed version
        # POSIX sh, not bash: a container job runs `sh -e {0}`, where `set -o
        # pipefail` is not a builtin and the step dies before it checks anything.
        # There are no pipes here, so `set -eu` is the whole of what was wanted.
        run: |
          set -eu
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if ! grep -q "mcr.microsoft.com/playwright:v${installed}-noble" .github/workflows/ci.yml; then
            echo "::error::@playwright/test is $installed — update the e2e job's container image to v${installed}-noble"
            exit 1
          fi
      # No-op when the image already carries the matching build, a download when
      # package.json has moved ahead of the image tag. Either way, never apt.
      - run: npx playwright install chromium
      # playwright.config.ts starts the built server itself, so it has to exist.
      - run: npm run build
        env:
          # `db`, not `localhost`: this job runs inside a container, so the
          # service container is a sibling on the network rather than the same
          # host. On localhost it would connect to nothing.
          DATABASE_URL: postgres://continuum:continuum@db:5432/continuum_e2e
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://continuum:continuum@db:5432/continuum_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [checks, e2e]
    # Releases only. A `release` event carries the tag in `github.ref` exactly
    # as a tag push does, so one test covers both — but the event is named as
    # well, so this still reads as what it means rather than as a coincidence
    # of how GitHub populates the ref.
    #
    # Every other trigger stops at `checks` and `e2e`. Building an image nobody
    # will pull cost roughly ten minutes of QEMU on each pull request, twice
    # over for two architectures.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    # Both credentials are secrets. The `secrets` context is not available in a
    # step's `if:`, so a bare `secrets.DOCKERHUB_USERNAME != ''` never matches
    # and the Docker Hub push is skipped without saying why — lifting the value
    # into the job's `env`, which secrets may be read into and which `if:` can
    # see, is what makes the condition work. A repository variable is accepted
    # too, so moving it later breaks nothing. Expect the username to appear
    # masked as *** in this job's log output.
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      # The account images live under, when that is not the account CI signs in
      # as — a Docker Hub organisation, say. Defaults to the sign-in account.
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # The job itself now runs only for a release, so neither login needs to
      # ask which event brought it here.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub — the registry `compose.yaml` pulls from, and the one the
      # README sends people to. Configured by DOCKERHUB_USERNAME +
      # DOCKERHUB_TOKEN (an access token, not the password); the tag step below
      # refuses the release outright when they are missing, rather than
      # publishing to GHCR alone and calling that a release.
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # A release publishes the version and moves `latest` onto it.
      - id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAMESPACE="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"

          # The job's `if:` should have kept every other ref out. Checked again
          # rather than assumed, because the failure it prevents is publishing
          # `latest` off an arbitrary commit — which is the whole reason this
          # job stopped running on main.
          if [[ "$REF" != refs/tags/* ]]; then
            echo "::error::$REF is not a tag — only a release publishes an image"
            exit 1
          fi
          TAG="${REF#refs/tags/}"

          # The tag and package.json disagreeing means one of them is a
          # mistake, and publishing either would be wrong. Releases have been
          # cut by hand until now, which is exactly how that drift happens.
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          # Docker Hub is where people pull from, so a release that quietly
          # skipped it would be worse than a failed build.
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error::releasing $TAG needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN set on the repository"
            exit 1
          fi

          # `latest` moves with the release, and only with a release.
          LABELS="$VERSION latest"

          TAGS=""
          for label in $LABELS; do
            TAGS="${TAGS:+$TAGS,}ghcr.io/${OWNER}/continuum:${label}"
            if [ -n "${NAMESPACE}" ]; then
              TAGS="$TAGS,${NAMESPACE}/continuum:${label}"
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # This job only runs for a release, and a release that built an image
          # and kept it is not a release. The condition this replaced tested for
          # a `push` event, which a published release is not — it would have
          # built the image and thrown it away.
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # So `docker inspect` can answer which version an image is without
          # trusting whatever tag it happens to be pulled under.
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
