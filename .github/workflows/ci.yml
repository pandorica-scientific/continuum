name: CI

on:
  push:
    branches: [main]
    # A release is a pushed tag: `git tag v0.3.5 && git push origin v0.3.5`.
    # Main publishes `latest` continuously; only a tag publishes a version, so
    # cutting a release stays a deliberate act rather than a side effect of
    # merging. The tag must match the version in package.json — see the image
    # job, which refuses the build otherwise.
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

  # The Playwright journey is the only coverage the auth, import, splits and
  # API-token paths have end to end. It existed but nothing ran it, so those
  # paths were effectively untested in CI.
  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts the built server itself, so it has to exist.
      - run: npm run build
        env:
          DATABASE_URL: postgres://continuum:continuum@localhost:5432/continuum_e2e
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://continuum:continuum@localhost:5432/continuum_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    permissions:
      contents: read
      packages: write
    # Both credentials are secrets. The `secrets` context is not available in a
    # step's `if:`, so a bare `secrets.DOCKERHUB_USERNAME != ''` never matches
    # and the Docker Hub push is skipped without saying why — lifting the value
    # into the job's `env`, which secrets may be read into and which `if:` can
    # see, is what makes the condition work. A repository variable is accepted
    # too, so moving it later breaks nothing. Expect the username to appear
    # masked as *** in this job's log output.
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      # The account images live under, when that is not the account CI signs in
      # as — a Docker Hub organisation, say. Defaults to the sign-in account.
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub (private repo) — publishes only when it is configured:
      # DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (an access token, not the password)
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # A tag push publishes the version *and* moves `latest`; a push to main
      # moves `latest` alone.
      - id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAMESPACE="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
          LABELS="latest"

          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
            # The tag and package.json disagreeing means one of them is a
            # mistake, and publishing either would be wrong. Releases have been
            # cut by hand until now, which is exactly how that drift happens.
            if [ "${TAG#v}" != "$VERSION" ]; then
              echo "::error::tag $TAG does not match package.json version $VERSION"
              exit 1
            fi
            # Docker Hub is where people pull from, so a release that quietly
            # skipped it would be worse than a failed build.
            if [ -z "${DOCKERHUB_USERNAME}" ]; then
              echo "::error::releasing $TAG needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN set on the repository"
              exit 1
            fi
            LABELS="$VERSION $LABELS"
          fi

          TAGS=""
          for label in $LABELS; do
            TAGS="${TAGS:+$TAGS,}ghcr.io/${OWNER}/continuum:${label}"
            if [ -n "${NAMESPACE}" ]; then
              TAGS="$TAGS,${NAMESPACE}/continuum:${label}"
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          # So `docker inspect` can answer which version an image is without
          # trusting whatever tag it happens to be pulled under.
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
