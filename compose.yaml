# Continuum — self-hosted household ledger
#
# Quick start:
#   1. Set POSTGRES_PASSWORD below (or in a .env file next to this file)
#   2. docker compose up -d
#   3. Open http://localhost and follow the setup wizard

services:
  app:
    # Docker Hub is the primary registry; ghcr.io/pandorica-scientific/continuum
    # mirrors it. Built for linux/amd64 and linux/arm64.
    image: kerth92/continuum:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      # Plain port 80 by default, so with a DHCP reservation and a LAN name
      # (see README) the address is just http://continuum.local — no port to
      # remember. If 80 is taken on the host, set CONTINUUM_PORT=3000 in .env;
      # compose fails loudly on a collision, never silently.
      - '${CONTINUUM_PORT:-80}:3000'
    environment:
      DATABASE_URL: postgres://continuum:${POSTGRES_PASSWORD:-continuum}@db:5432/continuum
      # Optional, and only about passkeys — see .env.example. Form submissions
      # are checked against the address the browser actually used, so the app is
      # reachable at every address it answers on without configuring any of them.
      ORIGIN: ${ORIGIN:-}
      # DEMO=1 seeds a fictional household on a pristine instance
      # (sign in as Jana Nováková / demo-demo-demo)
      DEMO: ${DEMO:-}
      # Behind a proxy — including the tailscale profile below — every request
      # arrives from that proxy, so the sign-in rate limiter counts the whole
      # household as one caller. Uncomment to read the real address from the
      # forwarded header, but only when the proxy is the only way in and always
      # overwrites it: anything that can reach the app directly could otherwise
      # forge the header and slip the limiter.
      # ADDRESS_HEADER: x-forwarded-for
      # XFF_DEPTH: '1'
      # Largest upload the server accepts. adapter-node's own default is 512K,
      # which rejects most phone photos with a bare 413 before the upload form
      # can say anything useful. Raise it if you file large scans.
      BODY_SIZE_LIMIT: ${CONTINUUM_MAX_UPLOAD:-32M}
    volumes:
      - continuum-data:/data
      # Backups land here (configure cadence in Settings → Backups). Point
      # CONTINUUM_BACKUPS at a cloud-synced folder on the host to have them
      # carried off-machine, e.g. in .env:
      #   CONTINUUM_BACKUPS=/Users/you/Library/CloudStorage/GoogleDrive-you@gmail.com/My Drive
      - ${CONTINUUM_BACKUPS:-continuum-backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  # On by default. Joins your tailnet and terminates HTTPS for the app, which is
  # what makes passkeys possible — browsers refuse WebAuthn outside a secure
  # context, so on a plain-HTTP address the passkey controls are simply absent.
  #
  # Tailnet-only, never public: the serve config below publishes to devices you
  # have added to your tailnet. The command that would expose the app to the
  # open internet is `tailscale funnel`, which nothing here runs.
  #
  # First run, in this order:
  #   1. docker compose up -d
  #   2. docker compose logs tailscale   → visit the authentication URL it prints
  #   3. put the name Tailscale issues in .env and restart:
  #        ORIGIN=https://continuum.<your-tailnet>.ts.net
  # Setting TS_AUTHKEY in .env instead skips steps 1-2 and authenticates
  # unattended.
  #
  # Not using Tailscale at all? `docker compose up -d app db` brings up the app
  # and the database on their own; the app stays reachable on the port above and
  # simply has no passkeys.
  #
  # Keep the app's port mapping above until a passkey sign-in over the tailnet
  # works, then remove it to make Tailscale the only way in.
  # HTTPS on the local network, without an account or a domain name.
  #
  #   CONTINUUM_HOST=continuum.local docker compose --profile lan-tls up -d
  #
  # The scanner's in-app camera needs a secure context and a plain-http LAN
  # address is not one, so without this — or Tailscale below — the viewfinder
  # cannot open on a phone. (The scan button still works there: it falls back to
  # the phone's own camera app.)
  #
  # Off unless asked for, and it is the QUICK route rather than the good one:
  # the certificate comes from Caddy's own authority, so every browser warns
  # once until you install its root. Accepting the warning is enough — the
  # origin is a secure context from then on. Tailscale gives a genuinely trusted
  # certificate and is the better answer for daily use.
  tls:
    profiles: ['lan-tls']
    image: caddy:2-alpine
    restart: unless-stopped
    # No config file to download: this is the whole configuration. `--from` must
    # be the address you actually type, because a certificate issued for a
    # different one is rejected outright rather than warned about — a LAN IP
    # works here as well as a name.
    command:
      - caddy
      - reverse-proxy
      - --from
      - https://${CONTINUUM_HOST:-continuum.local}:8443
      - --to
      - app:3000
      - --internal-certs
    ports:
      - '${CONTINUUM_TLS_PORT:-8443}:8443'
    volumes:
      # Keeps the certificate authority across restarts. Without it every
      # restart issues a new root and every device warns again.
      - caddy-state:/data
    depends_on:
      - app

  tailscale:
    image: tailscale/tailscale:latest
    hostname: continuum
    restart: unless-stopped
    environment:
      # A plain default, not `:?`. Empty is a supported state, not a
      # misconfiguration: the container comes up and prints a login URL to its
      # logs, which is the interactive path above. A required-variable guard
      # here would instead break `docker compose up -d` before anything runs.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
    configs:
      # Inlined rather than a file beside this one, so installing is a single
      # download. The `$$` in the content below is deliberate: it makes Compose
      # emit a literal ${TS_CERT_DOMAIN}, which the SIDECAR substitutes at
      # startup with the name Tailscale issued. Written with one `$`, Compose
      # expands it first and the sidecar receives an empty hostname.
      - source: tailscale-serve
        target: /config/serve.json
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum}
      POSTGRES_DB: continuum
    volumes:
      - continuum-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U continuum -d continuum']
      interval: 5s
      timeout: 3s
      retries: 10

configs:
  tailscale-serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://app:3000" } }
          }
        }
      }

volumes:
  continuum-data:
  continuum-db:
  continuum-backups:
  tailscale-state:
  caddy-state:
