# Continuum — self-hosted household ledger
#
# Quick start:
#   1. Set POSTGRES_PASSWORD below (or in a .env file next to this file)
#   2. docker compose up -d
#   3. Open http://localhost and follow the setup wizard

services:
  app:
    # Docker Hub is the primary registry (private for now — `docker login`
    # before pulling); ghcr.io/robertkiewisz/continuum mirrors it.
    image: kerth92/continuum:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      # Plain port 80 by default, so with a DHCP reservation and a LAN name
      # (see README) the address is just http://continuum.local — no port to
      # remember. If 80 is taken on the host, set CONTINUUM_PORT=3000 in .env;
      # compose fails loudly on a collision, never silently.
      - '${CONTINUUM_PORT:-80}:3000'
    environment:
      DATABASE_URL: postgres://continuum:${POSTGRES_PASSWORD:-continuum}@db:5432/continuum
      ORIGIN: ${ORIGIN:-http://localhost}
      # DEMO=1 seeds a fictional household on a pristine instance
      # (sign in as Jana Nováková / demo-demo-demo)
      DEMO: ${DEMO:-}
    volumes:
      - continuum-data:/data
      # Backups land here (configure cadence in Settings → Backups). Point
      # CONTINUUM_BACKUPS at a cloud-synced folder on the host to have them
      # carried off-machine, e.g. in .env:
      #   CONTINUUM_BACKUPS=/Users/you/Library/CloudStorage/GoogleDrive-you@gmail.com/My Drive
      - ${CONTINUUM_BACKUPS:-continuum-backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum}
      POSTGRES_DB: continuum
    volumes:
      - continuum-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U continuum -d continuum']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  continuum-data:
  continuum-db:
  continuum-backups:
