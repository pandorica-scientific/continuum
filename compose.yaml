# Continuum — your household's whole financial picture, on hardware you own.
#
#   docker run --rm kerth92/continuum compose > compose.yaml
#   docker compose up -d
#
# Then open http://continuum.local from any device on your network. That is
# the whole install; everything else is set up in the app. The same
# `docker compose up -d` later pulls the newest release and updates.
# Full instructions: https://github.com/pandorica-scientific/continuum/blob/main/docs/install.md

services:
  app:
    # Pulled from Docker Hub; ghcr.io/pandorica-scientific/continuum mirrors it.
    # Built for linux/amd64 and linux/arm64. Nothing is built on your machine —
    # a checkout of the repository adds compose.override.yaml for that.
    image: kerth92/continuum:latest
    # Every `docker compose up -d` checks for a newer image, so updating is the
    # install command run again.
    pull_policy: always
    restart: unless-stopped
    ports:
      # Plain http on port 80, so the address is just the name. If 80 is taken
      # on the host, set CONTINUUM_PORT in .env.
      - '${CONTINUUM_PORT:-80}:3000'
    environment:
      DATABASE_URL: postgres://continuum:${POSTGRES_PASSWORD:-continuum}@db:5432/continuum
      # DEMO=1 seeds a fictional household on a pristine instance
      # (sign in as Jana Nováková / demo-demo-demo).
      DEMO: ${DEMO:-}
      # Largest upload the server accepts; a phone photo needs more than the
      # server's own 512K default.
      BODY_SIZE_LIMIT: ${CONTINUUM_MAX_UPLOAD:-32M}
      # So the addresses it shows carry the port when it is not 80.
      CONTINUUM_PORT: ${CONTINUUM_PORT:-80}
      CONTINUUM_NAME: ${CONTINUUM_NAME:-continuum}
    volumes:
      - continuum-data:/data
      # Backups land here (cadence in Settings → Backups). Point
      # CONTINUUM_BACKUPS at a cloud-synced folder on the host to have them
      # carried off-machine.
      - ${CONTINUUM_BACKUPS:-continuum-backups}:/backups
      # The machine's name and addresses, as the announcer sees them, so the
      # setup wizard can say what to type on a phone.
      - continuum-net:/run/continuum:ro
    depends_on:
      db:
        condition: service_healthy

  # Answers `continuum.local` on the local network, so phones, tablets and
  # laptops reach the app by name with nothing installed and nothing typed
  # into a router. It has to sit on the host's network to be heard, and it
  # shares the host's name so the app can show the machine's own address too
  # — `http://raspberrypi/` on a Pi — which most routers already resolve.
  # Android browsers do not resolve .local; docs/networking.md has the rest.
  mdns:
    image: kerth92/continuum:latest
    pull_policy: always
    command: mdns
    network_mode: host
    uts: host
    restart: unless-stopped
    environment:
      # The name before .local. Change it if you run two instances.
      CONTINUUM_NAME: ${CONTINUUM_NAME:-continuum}
    volumes:
      - continuum-net:/run/continuum

  db:
    # The major version is pinned: Postgres will not open a data directory
    # written by another major. Patch releases within 18 are taken as they come.
    image: postgres:18-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum}
      POSTGRES_DB: continuum
      # Pinned rather than left to the image, so where this household's data
      # lives cannot move when the image's own default does.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - continuum-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U continuum -d continuum']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  continuum-data:
  continuum-db:
  continuum-backups:
  continuum-net:
